rules:
  - name: allow-git-push
    action: allow
    pattern:
      - ^git push$
  - name: allow-git-push-origin
    action: allow
    pattern:
      - ^git push origin
  - name: allow-git-push-upstream
    action: allow
    pattern:
      - ^git push --set-upstream
  - name: protect-env
    action: block
    pattern:
      - .env
  - name: dangerous-command
    action: confirm
    pattern:
      - rm -rf
      - git reset --hard
      - git push --force
  - name: database-operation
    action: confirm
    pattern:
      - DROP DATABASE
      - artisan migrate:fresh
